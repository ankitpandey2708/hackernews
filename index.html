<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hackernews.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Primary Meta Tags -->
    <title>HN Digest — Curated Tech Intelligence</title>
    <meta name="title" content="HN Digest — Curated Tech Intelligence" />
    <meta name="description" content="Stay ahead with HN Digest - your curated source for top Hacker News stories. Filter by category, points, and date to discover trending tech news, discussions, and insights from the developer community." />
    <meta name="keywords" content="hacker news, tech news, programming, developer news, software engineering, technology, startup news, HN digest, tech community, coding news" />
    <meta name="author" content="HN Digest" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="1 days" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://hackernews.lovable.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hackernews.lovable.app/" />
    <meta property="og:title" content="HN Digest — Curated Tech Intelligence" />
    <meta property="og:description" content="Stay ahead with HN Digest - your curated source for top Hacker News stories. Filter by category, points, and date to discover trending tech news, discussions, and insights from the developer community." />
    <meta property="og:image" content="https://hackernews.lovable.app/og-image.svg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:site_name" content="HN Digest" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://hackernews.lovable.app/" />
    <meta property="twitter:title" content="HN Digest — Curated Tech Intelligence" />
    <meta property="twitter:description" content="Stay ahead with HN Digest - your curated source for top Hacker News stories. Filter by category, points, and date to discover trending tech news, discussions, and insights from the developer community." />
    <meta property="twitter:image" content="https://hackernews.lovable.app/og-image.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "HN Digest",
      "alternateName": "Hacker News Digest",
      "url": "https://hackernews.lovable.app/",
      "description": "Curated tech intelligence from Hacker News - discover trending stories, discussions, and insights from the developer community.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://hackernews.lovable.app/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "inLanguage": "en-US",
      "publisher": {
        "@type": "Organization",
        "name": "HN Digest",
        "url": "https://hackernews.lovable.app/"
      }
    }
    </script>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Typography: Instrument Serif (Display) + Space Grotesk alternative: Outfit (Body) + JetBrains Mono (Code) -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      /* Critical CSS for instant dark theme */
      html { background-color: #0a0a0b; }
      body { background-color: #0a0a0b; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
